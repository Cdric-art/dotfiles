# Remplace /usr/lib/dracut/dracut.conf.d/10-nvidia-drivers.conf (même nom),
# qui exclut nvidia de l'initramfs. Ici on l'inclut : early KMS, le driver
# prend l'écran dès l'initramfs → plus de changements de mode au login tty.
install_items+=" /etc/modprobe.d/nvidia.conf "
force_drivers+=" nvidia nvidia_modeset nvidia_uvm nvidia_drm "
