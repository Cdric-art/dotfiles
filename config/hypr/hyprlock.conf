# hyprlock — thème Ghost Pastel (https://omarchytheme.com/themes/ghost-pastel)

$bg     = rgb(070506)
$fg     = rgb(ffffff)
$accent = rgb(979fec)
$muted  = rgb(836f79)
$red    = rgb(b37580)
$font   = Fira Code

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Pictures/1-GhostPastel.jpg
    color = $bg
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# Heure
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 90
    font_family = $font Bold
    position = 0, 180
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=fr_FR.UTF-8 date +"%A %-d %B"
    color = $accent
    font_size = 18
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 46
    outline_thickness = 1
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $accent
    inner_color = rgba(070506cc)
    font_color = $fg
    font_family = $font
    check_color = $muted
    fail_color = $red
    capslock_color = $red
    placeholder_text = <span foreground="##836f79">Mot de passe…</span>
    fail_text = <span foreground="##b37580">Mot de passe incorrect ($ATTEMPTS)</span>
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
