# hypridle — verrouillage et extinction de l'écran
# Désactivable depuis la Waybar (module idle_inhibitor, à droite de l'heure)

general {
    lock_cmd = pidof hyprlock || hyprlock          # un seul hyprlock à la fois
    before_sleep_cmd = loginctl lock-session       # verrouille avant la mise en veille
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 5 min : verrouillage
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 30 min : extinction de l'écran (rallumé au premier mouvement)
listener {
    timeout = 1800
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
